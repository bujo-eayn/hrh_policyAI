# Docker Compose configuration for HRH-PolicyAI
# Includes PostgreSQL with pgvector, Backend API, and Frontend UI

services:
  # PostgreSQL database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg18
    container_name: hrh-policyai-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrh_policyai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/setup_db.sql:/docker-entrypoint-initdb.d/setup_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hrh-network

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrh-policyai-backend
    environment:
      # Database connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hrh_policyai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      # JWT Configuration
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-this-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # Ollama Configuration (running on host machine)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-gemma3:latest}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-300}

      # Application Settings
      APP_NAME: ${APP_NAME:-HRH-PolicyAI}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-True}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # API Configuration
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_RELOAD: ${API_RELOAD:-False}

      # CORS Origins
      BACKEND_CORS_ORIGINS: '["http://localhost:8501","http://frontend:8501"]'

      # RAG Configuration
      CHUNK_SIZE: ${CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-50}
      DEFAULT_TOP_K: ${DEFAULT_TOP_K:-5}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.7}

      # File Upload Settings
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      ALLOWED_FILE_TYPES: ${ALLOWED_FILE_TYPES:-[".pdf",".docx"]}

      # Regulatory Bodies
      REGULATORY_BODIES: ${REGULATORY_BODIES:-["KMPDB","NCK","COC","PPB","PHOTC"]}

      # Security
      BCRYPT_ROUNDS: 12
      PASSWORD_MIN_LENGTH: 8

    ports:
      - "${API_PORT:-8000}:8000"

    volumes:
      - upload_data:/app/data/uploads

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

    networks:
      - hrh-network

    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Streamlit Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hrh-policyai-frontend
    environment:
      # Backend API URL (use service name for inter-container communication)
      API_BASE_URL: ${API_BASE_URL:-http://backend:8000/api/v1}

      # Streamlit Configuration
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: false
      STREAMLIT_SERVER_HEADLESS: true
      STREAMLIT_SERVER_ENABLE_CORS: true
      STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION: true

    ports:
      - "${STREAMLIT_PORT:-8501}:8501"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

    networks:
      - hrh-network

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  upload_data:
    driver: local

# Network for inter-service communication
networks:
  hrh-network:
    driver: bridge
